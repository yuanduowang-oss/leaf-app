name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Android platform (v2 embedding)
        run: flutter create --platforms=android .

      - name: Build debug APK
        run: flutter build apk --debug || true

      - name: Find APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          echo "=== build/app directory ==="
          ls -la build/app/ 2>/dev/null || true
          ls -la build/app/outputs/ 2>/dev/null || true
          echo "=== android/app/build ==="
          ls -la android/app/build/outputs/apk/ 2>/dev/null || true
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload APK (standard path)
        uses: actions/upload-artifact@v4
        with:
          name: leaf-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK (alt path)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-app-debug-alt
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-web:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: leaf-web
          path: build/web/
