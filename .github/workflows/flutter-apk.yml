name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Android platform (v2 embedding)
        run: flutter create --platforms=android .

      - name: Build debug APK
        run: flutter build apk --debug || echo "Flutter APK path check failed, but APK may still exist"

      - name: Collect APK from alt location
        if: always()
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p apk-output
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/
            echo "APK found at alt location"
          elif [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mkdir -p apk-output
            cp build/app/outputs/flutter-apk/app-debug.apk apk-output/
            echo "APK found at standard location"
          else
            echo "Searching for APK..."
            find . -name "*.apk" -type f
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-app-debug
          path: apk-output/

  build-web:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /leaf-app/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: leaf-web
          path: build/web/
