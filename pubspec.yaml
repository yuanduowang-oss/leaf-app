name: leaf
description: "Leaf - 新能源汽车内容平台，连接全球EV用户"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.10

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # UI & Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  video_player: ^2.11.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  google_sign_in: ^6.2.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  # Maps (OpenStreetMap - free, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Dependency Injection
  get_it: ^8.0.3

  # ML Kit Translation (设备端翻译)
  translator: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
